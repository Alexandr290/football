# =====================================================================
#  AdvancedSoccer - Main Configuration
# =====================================================================
# Almost every gameplay value lives here so you can tune the feel of
# the game without touching code. Colors use '&' codes (and hex &#RRGGBB).
# =====================================================================

config-version: 22

settings:
  # Chat prefix (overrides the language file prefix when set).
  prefix: "&8[&aSoccer&8] &r"
  # Language file to load from plugins/AdvancedSoccer/lang/ (en, ru).
  language: en
  # How often (in seconds) arenas/stats are auto-saved to disk.
  auto-save-interval: 300
  # Use the action bar for HUD (power/stamina). If false, uses XP bar only.
  action-bar-hud: true

# ---------------------------------------------------------------------
# Match / game flow
# ---------------------------------------------------------------------
game:
  # Players required per team before a match can auto-start.
  min-players-per-team: 1
  # Raised so a full solo match (a player plus up to 10 AI team-mates, against up
  # to 10 AI opponents) fits on each side.
  max-players-per-team: 11
  # Seconds of the lobby countdown once enough players have joined.
  lobby-countdown: 15
  # Seconds of the kickoff countdown (3..2..1..GO) before the ball unlocks.
  kickoff-countdown: 3
  # Total match duration in seconds (split across halves).
  match-duration: 300
  # Number of halves. Duration is divided evenly between them.
  halves: 2
  # Seconds of break at half time.
  halftime-break: 30
  # If true, a tied match goes to golden-goal extra time.
  golden-goal: true
  golden-goal-duration: 120
  # If a golden goal match is still tied, decide by penalty shootout.
  penalty-shootout: true
  # Allow players to rejoin a match in progress.
  allow-rejoin: true
  # End the match immediately if one team reaches this lead (mercy rule). 0 = off.
  mercy-rule-lead: 0
  # When true, the ball crossing a touchline (sideline) triggers a throw-in restart.
  # When false, the ball is reset to center instead.
  throw-in-enabled: true
  # Nearest throw-in team player is teleported to the ball and must take the throw-in.
  throw-in-auto-taker: true
  throw-in-taker-only-kick: true
  throw-in-taker-glow: true
  throw-in-taker-particles: true
  throw-in-taker-snap-back: true
  throw-in-taker-wander-blocks: 2.0
  # When true, offside is enforced (IFAB rules): judged when the ball is played,
  # penalised when an offside attacker becomes involved. Indirect free kick restart.
  offside-enabled: true
  # Auto-select the nearest defending-team player, teleport them to the ball, and
  # require them to take the indirect free kick.
  offside-auto-taker: true
  offside-taker-only-kick: true
  offside-taker-glow: true
  offside-taker-particles: true
  offside-taker-snap-back: true
  offside-taker-wander-blocks: 2.0
  # Keep offside attackers away from the restart spot until the kick is taken.
  offside-restrain-opponents: true
  offside-opponent-restrain-radius: 8.0
  offside-opponent-min-gap: 3.0
  # TV-style score + ascending match clock at the top of the screen during play.
  broadcast-hud: true
  # When true, /soccer quickjoin opens a menu to pick Red or Blue before joining.
  # Use /soccer quickjoin red|blue to skip the menu and join a side directly.
  quickjoin-team-pick: true

# ---------------------------------------------------------------------
# BungeeCord network — lobby sends players to the game backend for matches.
# Requires bungeecord: true in spigot.yml on every backend.
# ---------------------------------------------------------------------
network:
  enabled: false
  # standalone = normal single-server behaviour
  # lobby      = /soccer quickjoin and /soccer join send players to game-server
  # game       = hosts matches and can send players back to lobby-server
  role: standalone
  # BungeeCord server names from the proxy config.yml (NOT IP addresses).
  game-server: soccer
  lobby-server: lobby
  pending-join-timeout-seconds: 45
  # Game backend only — send players back to lobby-server when they leave or a match ends.
  return-to-lobby-on-leave: true
  return-to-lobby-on-match-end: true

# ---------------------------------------------------------------------
# Match bots — solo practice vs AI opponents.
# ---------------------------------------------------------------------
bots:
  enabled: true
  # How bots are rendered. They look and animate like real NPC players in every
  # mode except the last-resort armor stand.
  #   auto        = Citizens NPC if installed, else a built-in packet player NPC
  #                 (real player model + skin, no plugins needed), else Mannequin
  #                 (1.21.4+), else armor stand.
  #   player/npc  = force the built-in packet player NPC.
  #   citizens | mannequin | armor_stand = force that specific backend.
  visual: auto
  min-solo-count: 1
  # Up to 10 bots can be added per side (opponents and/or your own team).
  max-solo-count: 10
  default-solo-count: 4
  # How many AI team-mates are pre-selected when opening the solo menu (0 = none).
  default-teammate-count: 0
  # Blocks per tick — walk matches vanilla (~0.216); sprint matches a real
  # player-like burst so bots can accelerate into space and chase loose balls.
  walk-speed: 0.216
  sprint-speed: 0.36
  # Bot stamina. When enabled, bots can only sprint while they have stamina; once
  # drained they drop to a tired jog and must recover before sprinting again —
  # just like human players. This produces realistic late-game tempo swings.
  stamina-enabled: true
  max-stamina: 100.0
  # Stamina recovered per tick while not sprinting (20 ticks = 1 second).
  stamina-regen: 0.65
  # Stamina burned per tick while sprinting.
  sprint-drain: 0.5
  # Once exhausted, a bot must regenerate back above this value before it can
  # sprint again (prevents stutter-sprinting on empty).
  stamina-recover-threshold: 35.0
  names:
    - "Striker"
    - "Midfielder"
    - "Winger"
    - "Playmaker"
    - "Defender"
  # Minecraft profile names used for Citizens NPC skins (rotated by bot index).
  skin-names:
    - "Notch"
    - "jeb_"
    - "Dinnerbone"
    - "Grumm"
    - "MHF_Steve"

# ---------------------------------------------------------------------
# Match referee — center official + two assistant referees (linesmen).
# ---------------------------------------------------------------------
referee:
  enabled: true
  # auto = Mannequin player body on 1.21.4+, else armor stand | mannequin | armor_stand
  entity-type: auto
  # Optional Base64 skin texture (same format as ball.head-texture). Blank = default Steve/Alex.
  skin-texture: ""
  name: "Referee"
  assistant-names:
    - "AR 1"
    - "AR 2"
  # Lateral distance from play (blocks) — refs run diagonally, not on top of the ball.
  follow-distance: 5.5
  # How far behind the ball (as a fraction of pitch length) the center ref trails play.
  trail-offset: 0.045
  walk-speed: 0.16
  sprint-speed: 0.30
  sprint-threshold: 4.0
  whistle-enabled: true

# ---------------------------------------------------------------------
# Goal replay — TV-style cinematic playback after every goal.
# ---------------------------------------------------------------------
replay:
  enabled: true
  # How many seconds of live play to keep in the rolling buffer.
  buffer-seconds: 15
  # Length of the replay clip shown after a goal (seconds).
  clip-seconds: 10
  # Frames advanced per server tick (lower = slower motion). 0.55 ≈ half speed.
  playback-speed: 0.55
  # Ticks to hold on the goal frame before the replay begins (20 ticks = 1 sec).
  goal-hold-ticks: 25
  # Particle trail following the ball during replay.
  ball-trail: true
  # Highlight the scorer with glow near the end of the clip.
  scorer-glow: true
  # Progress bar at the top of the screen during replay.
  boss-bar: true
  # Camera style: cinematic (multi-angle), chase, broadcast
  camera-style: cinematic
  # Pitch actors: auto (mannequin on 1.21.4+, else armor stand), mannequin, armor_stand
  actor-type: auto

# ---------------------------------------------------------------------
# Crowd atmosphere — real stadium recordings.
# Default mode is MANUAL: no download server. Install the pack once locally:
#   plugins/AdvancedSoccer/AdvancedSoccer-Crowd.zip
#   → copy to .minecraft/resourcepacks/ → Options > Resource Packs > enable
# ---------------------------------------------------------------------
crowd:
  enabled: true
  volume: 0.85
  # false = vanilla non-animal stadium effects (no resource pack needed).
  # true = real stadium crowd pack (auto-offered below).
  real-sounds: true
  # Ticks between long ambience bed layers (20 ticks = 1 sec).
  # The plugin automatically shortens this near the goals for louder pressure.
  ambience-interval-ticks: 70
  danger-radius: 18.0
  danger-min-speed: 0.75
  goal-celebration: true
  react-to-saves: true
  react-to-shots: true
  resource-pack:
    # manual = local install only, no server download | download | url
    mode: download
    auto-serve: true
    prompt-on-join: true
    port: 8123
    public-host: ""
    url: ""
    use-hash: true

# ---------------------------------------------------------------------
# Championships — leagues & knockout cups with GUI registration.
# ---------------------------------------------------------------------
championships:
  enabled: true
  min-teams-to-start: 2
  max-teams: 16
  points-win: 3
  points-draw: 1
  points-loss: 0
  playoffs-enabled: true
  playoff-qualifiers: 8
  playoff-min-teams: 4
  group-count: 8
  teams-per-group: 2
  advance-per-group: 1

# ---------------------------------------------------------------------
# Ball physics - the heart of the plugin.
# Values are per-tick unless stated otherwise (20 ticks = 1 second).
# ---------------------------------------------------------------------
ball:
  # Visual: the head texture / item used to render the ball.
  # Options: SNOWBALL (item), HEAD (custom soccer-ball player head), FIREWORK_STAR
  display: HEAD
  # Custom Base64 texture for the soccer ball head (classic black/white ball).
  head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmM4ZWE3MWE1ZjJiZjMzNmY4ODFkMTcyMGI1ODdiNmU1OWM5MWRjN2RkNGY0ODBmMzZkMzMyZGE0YzkzM2EifX19"
  # World gravity applied to the ball each tick (blocks/tick^2). Higher = the
  # ball falls faster and arcs are tighter.
  gravity: 0.048
  # Light linear air retention each airborne tick (1.0 = none). Keep close to 1;
  # most slowdown should come from the quadratic drag below.
  air-resistance: 0.992
  # Quadratic air drag coefficient. Drag scales with speed (~v^2), so powerful
  # shots lose pace quickly while gentle balls glide. Raise for a "heavier" ball.
  drag-coefficient: 0.006
  # Rolling resistance multiplier applied to horizontal speed while on the
  # ground (per tick). Higher (closer to 1) = the ball rolls further.
  ground-friction: 0.93
  # Fraction of rolling speed converted into visible spin (cosmetic feel).
  rolling-spin-transfer: 0.12
  # Bounciness: vertical speed retained after a bounce (0 = dead, 1 = perfect).
  # Real footballs on grass are around 0.6.
  restitution: 0.62
  # Horizontal speed retained each time the ball bounces (turf scrub).
  bounce-friction: 0.78
  # Vertical speed (blocks/tick) below which the ball stops bouncing and settles
  # into a roll. Prevents endless tiny bounces / jitter.
  bounce-threshold: 0.12
  # Below this horizontal speed (blocks/tick) a rolling ball is considered at rest.
  rest-threshold: 0.035
  # Magnus effect strength - converts spin into a sideways/lifting curving force.
  magnus-strength: 0.022
  # How much spin is retained each tick (closer to 1 = curve lasts longer).
  spin-decay: 0.97
  # Maximum speed (blocks/tick) the ball is allowed to travel (safety clamp).
  max-speed: 4.5
  # Radius (blocks) used for ball<->player collision detection.
  collision-radius: 0.65
  # Relative ball mass (reserved for tuning kick impulse transfer).
  mass: 1.0
  # The ball will be teleported back to center if it leaves the arena bounds.
  reset-when-out: true

# ---------------------------------------------------------------------
# Player kicking / shooting mechanics.
# ---------------------------------------------------------------------
mechanics:
  # Max horizontal reach (blocks) to touch the ball.
  kick-reach: 3.0
  # Base kick power applied on a light touch (left-click / walking into ball).
  light-touch-power: 0.45
  # Maximum charged-shot power (sneak + hold to charge, then release).
  max-shot-power: 2.8
  # Seconds to fully charge a shot from min to max.
  charge-time: 1.2
  # Upward lift added to shots so the ball arcs realistically.
  shot-lift: 0.32
  # Multiplier applied to a pass (right-click) vs a shot (left-click).
  pass-power-multiplier: 0.6
  # Extra power granted while sprinting (adds player momentum to the ball).
  sprint-bonus: 0.35
  # Spin imparted based on where the player looks vs moves (curve shots).
  curve-strength: 0.9
  # Sliding tackle: sneak + sprint to slide and steal the ball.
  tackle-enabled: true
  tackle-power: 1.1
  tackle-cooldown: 4.0
  # Stamina system. Sprinting/charging consumes stamina.
  stamina-enabled: true
  max-stamina: 100.0
  stamina-regen: 1.2
  sprint-drain: 0.6
  charge-drain: 0.8
  tackle-drain: 18.0
  # Goalkeeper: players inside their own goal box get a catch radius bonus.
  keeper-catch-bonus: 1.5

# ---------------------------------------------------------------------
# Scoreboard — optional overrides (defaults from lang/<language>.yml).
# Leave title/lines empty or remove them to use the language file.
# ---------------------------------------------------------------------
scoreboard:
  enabled: true
  # title: "&a&lADVANCED SOCCER"
  # lines: []

# ---------------------------------------------------------------------
# Chat leaderboards — /leaderboard, /soccer top, periodic broadcasts
# ---------------------------------------------------------------------
leaderboard:
  # Post a rotating leaderboard to chat every N seconds. 0 = disabled.
  broadcast-interval: 1800
  # Rows shown for /soccer top and /leaderboard <category>.
  entries: 10
  # Rows per category when using /leaderboard or /soccer top all.
  overview-entries: 3
  # Categories cycled through each broadcast (goals, wins, assists, tackles, saves, clean-sheets).
  broadcast-categories:
    - goals
    - wins
    - assists

# ---------------------------------------------------------------------
# Teams
# ---------------------------------------------------------------------
teams:
  red:
    name: "Red"
    color: "RED"
    chat-color: "&c"
  blue:
    name: "Blue"
    color: "BLUE"
    chat-color: "&9"

# ---------------------------------------------------------------------
# Messages — optional overrides. Defaults come from lang/<language>.yml
# (lang/en.yml, lang/ru.yml). Copy those files to plugins/AdvancedSoccer/lang/
# to customize. Set settings.language to "ru" for Russian.
# ---------------------------------------------------------------------
messages: {}
